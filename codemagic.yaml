workflows:
  ios-workflow:
    name: iOS App Store & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      # GAP-057: the same Flutter as .github/workflows/shorebird.yml (FLUTTER_VERSION) and
      # within pubspec.lock's sdks (test/qa/ci_flutter_version_test.dart checks it). Swift
      # Package Manager is switched off by the first script, as in the Shorebird iOS job.
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alnagar.washup
    scripts:
      - name: Disable SPM & clean all caches
        script: |
          # Write the flutter config file directly (most reliable method)
          mkdir -p "$HOME/.config/flutter"
          echo '{"enable-swift-package-manager": false}' > "$HOME/.config/flutter/settings.json"

          # Also apply via CLI (belt-and-suspenders)
          flutter config --no-enable-swift-package-manager

          # Confirm it's disabled
          flutter config | grep swift || true

          # Clean everything
          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf build

      - name: Fetch signing files (Runner + BookingLiveActivity)
        script: |
          app-store-connect fetch-signing-files "com.alnagar.washup" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.alnagar.washup.BookingLiveActivity" --type IOS_APP_STORE --create
          xcode-project use-profiles

      - name: Get dependencies
        script: |
          flutter packages pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Build IPA Release
        script: |
          flutter build ipa --release --no-pub \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      # Build e-mails: add the team address in the app's Codemagic settings, or an
      # "email: recipients:" block with a shared team mailbox. No personal address is
      # kept in the repository (GAP-040).
