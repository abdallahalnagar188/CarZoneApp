workflows:
  ios-workflow:
    name: iOS App Store & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key configured in Codemagic:
      # Team settings > Integrations > Apple Developer Portal
      app_store_connect: codemagic_api_key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alnagar.washup
    scripts:
      - name: Disable Swift Package Manager (fix Firebase & GoogleSign-In conflict)
        script: |
          # Disable SPM for standard Flutter
          flutter config --no-enable-swift-package-manager

          # CRITICAL: Disable SPM directly in the Shorebird vendored Flutter instance
          if command -v shorebird &> /dev/null; then
            shorebird flutter config --no-enable-swift-package-manager || true
          fi
          if [ -d "$HOME/.shorebird/bin" ]; then
            $HOME/.shorebird/bin/shorebird flutter config --no-enable-swift-package-manager || true
          fi

          # Clean ephemeral files before dependency resolution
          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Pods ios/Podfile.lock
      - name: Set up code signing settings on Xcode project
        script: |
          app-store-connect fetch-signing-files "com.alnagar.washup" --type IOS_APP_STORE --create || true
          app-store-connect fetch-signing-files "com.alnagar.washup.BookingLiveActivity" --type IOS_APP_STORE --create || true
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS release
        script: |
          SHOREBIRD_BIN=""
          if command -v shorebird &> /dev/null; then
            SHOREBIRD_BIN="shorebird"
          elif [ -d "$HOME/.shorebird/bin" ]; then
            SHOREBIRD_BIN="$HOME/.shorebird/bin/shorebird"
          fi

          if [ -n "$SHOREBIRD_BIN" ]; then
            $SHOREBIRD_BIN release ios --flutter-version=3.29.0 --no-confirm --export-options-plist=/Users/builder/export_options.plist
          else
            flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - bdallhmsd807@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Release (AAB)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - bdallhmsd807@gmail.com
        notify:
          success: true
          failure: true
