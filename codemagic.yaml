workflows:
  ios-workflow:
    name: iOS App Store & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alnagar.washup
    scripts:
      - name: Disable SPM & Clean Caches
        script: |
          flutter config --no-enable-swift-package-manager
          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf build

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.alnagar.washup" --type IOS_APP_STORE --create || true
          app-store-connect fetch-signing-files "com.alnagar.washup.BookingLiveActivity" --type IOS_APP_STORE --create || true
          xcode-project use-profiles

      - name: Get dependencies
        script: |
          flutter packages pub get

      - name: Install Pods
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Build IPA Release
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - bdallhmsd807@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Release (AAB)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get dependencies
        script: |
          flutter packages pub get
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - bdallhmsd807@gmail.com
        notify:
          success: true
          failure: true